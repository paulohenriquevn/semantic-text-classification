[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talkex-engine"
version = "0.9.0"
description = "NLP platform for large-scale conversation analysis in call centers and digital service channels"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0,<9.0",
    "numpy>=1.24,<3.0",
    "pydantic>=2.0,<3.0",
    "structlog>=23.0,<25.0",
]

[project.scripts]
talkex = "talkex.pipeline.cli:main"

[project.optional-dependencies]
qdrant = [
    "qdrant-client>=1.7,<2.0",
]
monitoring = [
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "psycopg-pool>=3.2,<4.0",
    "sse-starlette>=2.0,<3.0",
]
lifecycle = [
    "pyarrow>=16,<26",
    "pandas>=2.0,<4.0",
]
dev = [
    "mypy>=1.8,<2.0",
    "pytest>=7.0,<9.0",
    "pytest-asyncio>=0.21,<1.0",
    "pytest-cov>=4.0,<6.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["talkex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: tests that require a running TimescaleDB (deploy/monitoring/docker-compose.yml)",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["talkex"]
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

# Third-party libs without type stubs (py.typed). Standard override so untyped
# imports do not fail the gate — applies to the ML backends used by classifiers.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "psycopg_pool.*", "sentence_transformers.*", "pyarrow.*", "pandas.*"]
ignore_missing_imports = true

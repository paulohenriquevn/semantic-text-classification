# M0 walking-skeleton storage spine (ADR-005): a real TimescaleDB for dev + integration tests.
# Port 5433 because 5432 is occupied locally. timescaledb-ha bundles pgvector (used from M1 on).
services:
  timescale:
    image: timescale/timescaledb-ha:pg16
    container_name: talkex_monitoring_timescale
    environment:
      POSTGRES_USER: talkex
      POSTGRES_PASSWORD: talkex
      POSTGRES_DB: talkex_monitoring
    ports:
      - "5433:5432"
    volumes:
      - talkex_monitoring_pgdata:/home/postgres/pgdata/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkex -d talkex_monitoring"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  talkex_monitoring_pgdata:
